{% extends "admin/index.html" %}
{% load i18n %}

{% block content %}
<div style="margin-bottom: 2rem; padding: 1.5rem; background: #1a1a1a; border: 1px solid #2a2a2a;">
  <h2 style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #00F0FF; margin: 0 0 1rem 0;">
    Inquiry Overview
  </h2>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem;">
    {% for label, count, color in inquiry_stats %}
    <div style="padding: 1rem; border: 1px solid #2a2a2a; text-align: center;">
      <div style="font-size: 2rem; font-weight: bold; color: {{ color }};">{{ count }}</div>
      <div style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6b6b6b; margin-top: 0.25rem;">
        {{ label }}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{{ block.super }}
{% endblock %}
